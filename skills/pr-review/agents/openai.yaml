interface:
  display_name: "PR Pre-Review"
  short_description: "Find evidence-backed issues before human PR review"
  default_prompt: "Orchestrate a pre-review of this pull request: pin the exact head, dispatch focused rubric subagents, adjudicate evidence-backed findings, publish the rubric table, detail comments, inline findings, and pr-review labels, and never modify, approve, or merge code. Say local or dry-run to suppress publication."
policy:
  allow_implicit_invocation: false
